<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomoc w szkole</title>
  <meta name="description" content="Pomoc w nauce dla uczniów szkoły podstawowej: klasa 3, klasa 4, klasa 8 i przygotowanie do egzaminu ósmoklasisty. Lekcje, ściągi, fiszki i quizy.">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Dawne adresy (sprzed podziału na ścieżki) prowadziły do ścieżki egzaminacyjnej: index.html#/s/…, #/powtorka, #/zrodla.
    (function () {
      var old = function () {
        if (/^#\/(s|powtorka|zrodla)(\/|$)/.test(location.hash)) location.replace('egzamin.html' + location.hash);
      };
      old();
      window.addEventListener('hashchange', old);
    })();
  </script>
</head>
<body>
  <header class="top">
    <a href="index.html" class="logo">🎒 Pomoc w szkole</a>
  </header>
  <main id="app" aria-live="polite">
    <section class="hero">
      <h1>Cześć! 👋</h1>
      <p>Wybierz swoją klasę albo przygotowanie do egzaminu. Każda ścieżka ma własne materiały i własny zapis postępu – na jednym urządzeniu może się uczyć kilkoro dzieci z różnych klas.</p>
    </section>
    <div class="grid tracks" id="tracks"></div>
    <noscript><p>Do działania aplikacji potrzebny jest włączony JavaScript.</p></noscript>
  </main>
  <footer class="foot">
    Postęp zapisuje się tylko na tym urządzeniu. Treści warto skonsultować z nauczycielem.
  </footer>

  <script src="js/sciezki.js"></script>
  <script src="js/postep.js"></script>
  <script src="js/wybor.js"></script>
</body>
</html>
